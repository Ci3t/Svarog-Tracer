<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Svarog Tracer</title>
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // Keep /Svarog-Tracer/
      var l = window.location;
      var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var query = l.search ? l.search : '';
      var hashRoute = routePath ? '#/' + routePath : '#/';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/' + hashRoute + query
      );
    </script>
  </head>
  <body>
  </body>
</html>
